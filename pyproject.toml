[project]
name = "blender-forge"
version = "0.1.0"
description = "Reusable 'assets-as-code' toolkit: CLI (bforge) + bpy library (forge) for generating low-poly game assets with Blender headless and exporting them straight to Godot-ready GLB."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Vladimir Bondarenko" }]
# bforge (the CLI, run by the *system* Python via uv) has NO third-party
# dependencies on purpose: it only shells out to a Blender binary. The
# `forge` package (src/forge) runs *inside* Blender's bundled Python and is
# never installed as a dependency of this project - it is reached via
# sys.path manipulation from runner_entry.py. See README "Architecture".
dependencies = []

[project.scripts]
bforge = "bforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bforge"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
markers = [
    "blender: integration test that spawns a real Blender subprocess (skipped if no blender binary is found)",
]
testpaths = ["tests"]
